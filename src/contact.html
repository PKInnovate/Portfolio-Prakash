<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Prakash - Visionary Leader</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="dark-theme">
    <main>
        <section class="section" style="padding-top: 15rem;">
            <div class="container">
                <div class="contact-card">
                    <h1 class="section-title">Start a Conversation</h1>
                    <p style="margin: 2rem 0; color: var(--text-dim);">Whether you are a founder seeking strategic
                        advisory or an enterprise looking for high-impact systems innovation, I look forward to
                        connecting.</p>
                    <form id="contact-form">
                        <div class="form-group">
                            <input type="text" placeholder="Name" required>
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Email" required>
                        </div>
                        <div class="form-group">
                            <textarea placeholder="Message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="js/main.js"></script>
</body>

</html>
